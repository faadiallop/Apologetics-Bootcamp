schema_version: "1.1"
name: opens-for-a-beginner
expected_outcome: |
  Opening test. Guards "Opening the training": ask only what he hasn't told you,
  introduce the training to one who is new to the group, offer a beginner
  background first, and speak of the content, never the documents.

  Philip has already said which group, that he is a beginner, and that he is not on
  voice. He has no card.

  The coach asks none of that again. In a minute or two it tells him the method, the
  argument for Jehovah's Witnesses in one sentence, why this approach was chosen, and
  what the training will involve. It offers him background first or not. It does not quiz him on anything it has not taught.
context:
  scaffold_script: place-files.sh
