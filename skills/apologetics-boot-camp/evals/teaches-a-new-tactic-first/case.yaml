schema_version: "1.1"
name: teaches-a-new-tactic-first
expected_outcome: |
  Session test. Guards "Each session," step 3: teach a tactic before you ask him
  anything about it, whenever it is new to him with this group, beginner or not.

  Samuel is not a beginner. He started with practice conversations and has just
  cleared step 1, gathering, against Muslims. His next tactic, step 2, asking for
  reasons, came up in his first conversation, but he has never been taught it.

  After telling him to pray and any recall of what he has been taught, the coach
  teaches step 2 in a few spoken sentences: what it is, which move by the member
  calls for it, the question it asks, and one example from the Islam material. It
  checks the lesson with one question. Only then does it ask him to plan or start a
  round. It asks him nothing about step 2 before the lesson.
context:
  scaffold_script: place-files.sh
