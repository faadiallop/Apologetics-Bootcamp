name: marks-missed-requests-for-reasons
expected_outcome: |
  Marking test. Guards "Working on what he finds hardest" (mark every chance; drill it)
  and "A practice conversation, in voice" (coach after each one).

  Daniel is drilling step 2, asking for reasons. Derek made four main claims. Daniel
  asked for reasons twice ("How did you come to that conclusion?", "What makes you say
  that?") and missed twice: once by arguing against the claim himself ("Faith in the
  Bible is trust in what God has said and done. It isn't blind at all"), once with a
  soft "Are you sure about that?" So his count is two of four, and the round is not
  a pass.

  The coach says so aloud in under a minute: one thing done well, the tactic as the
  thing to change with his own words quoted, his count, and what comes next. Then it
  saves a new card above his old one.
