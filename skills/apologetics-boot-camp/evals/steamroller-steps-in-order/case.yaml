schema_version: "1.1"
name: steamroller-steps-in-order
expected_outcome: |
  Next-turn test. Guards the steamroller's order: each step answers a new
  interruption (stop at the first, shame at the next, leave at the one after).

  Marcus is drilling the steamroller. Yusuf has cut in twice. Marcus stopped him
  rightly at the first, but answered the second by leaving, one step early, so he
  cannot mend the miss on his next turn. No time-out has been called in this round.

  The coach's next turn is a time-out, not Yusuf's answer: it marks the exit a miss
  because it came a step early, gives Marcus a gentle shame line to use at the
  second interruption, and has him try that turn again.
context:
  scaffold_script: place-files.sh
