schema_version: "1.1"
name: ends-the-round-when-the-goal-is-met
expected_outcome: |
  Next-turn test. Guards "How long a round runs": end the round as soon as its goal
  is met; "Every round still keeps Christ in view": in a round where no flaw has been
  exposed there are no closing turns, the coach asks him after the coaching how he
  would get to Christ from there, and no pass waits on it; and "Measuring the trainee": a pass takes two in a row.

  Thomas is drilling step 1. He asked questions only and said Sarah's view back to her
  accurately; she agreed, and he has thanked her. No flaw has been exposed, so the
  round has no closing turns.

  In its next turn the coach steps out and ends the round at once. It coaches him in
  under a minute, ends by asking him how he would get to Christ from where the round
  ended, and still counts this as the first of the two passes in a row he
  needs.
context:
  scaffold_script: place-files.sh
