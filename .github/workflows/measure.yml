# Build step 3 of measure/PLAN.md: the conversation tests, run through the API.
#
# - On a pull request, a screen: the tests the change reaches, once with Sonnet,
#   compared with the latest full run of the base branch (PLAN.md, section 4).
# - By hand (Actions > measure > Run workflow, choosing the branch), a full run
#   of that branch: every test three times, kept as this workflow's artifact
#   for screens of pull requests to that branch to compare with.
# - From the release (release.yml), the same full run of the commit it is about
#   to release. With neither secret below, it says so and passes, and the
#   release's summary says the measure was not run.
#
# The API key is a secret, so a pull request must never run its own code beside
# it. This workflow runs on pull_request_target, which uses the base branch's
# copy of this file and of measure/; the pull request's files are only read, as
# the skill under test, never run.
#
# Needs: an environment named "measure", allowed for main and next, holding
# either the secret ANTHROPIC_API_KEY (the API way: cheaper, through the Batch
# API, with a spending limit on the key's workspace) or the secret
# CLAUDE_CODE_OAUTH_TOKEN (the author's subscription, made with
# `claude setup-token`; the tests then run through Claude Code's own runner).
# The API key is used when both are there.
#
# With the subscription, a screen tests the pull request's skill against the
# base branch's own tests and settings, so that no file a pull request wrote,
# such as a test's setup script, runs beside the token. New tests in a pull
# request are therefore first run at the next full run.
name: measure

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      cap:
        description: "Most it may cost, in US dollars (with the subscription, the usage it may use, priced as the API would)"
        default: "40"
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      cap:
        type: string
        default: "40"

permissions:
  contents: read
  actions: read

jobs:
  screen:
    if: github.event_name == 'pull_request_target'
    name: Conversation tests (screen)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: measure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch the pull request's commits, as data
        run: git fetch -q origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: Find the tests the change reaches
        id: reach
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="$(git merge-base "$BASE" "$HEAD")"
          tests="$(python3 measure/coverage.py "$from" "$HEAD" --json | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)))')"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          if [ -z "$tests" ]; then echo "The change reaches no conversation test." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fetch the latest full run of the base branch
        if: steps.reach.outputs.tests != ''
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow measure.yml --branch "$BRANCH" \
            --event workflow_dispatch --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No full run of $BRANCH is stored yet, so there is nothing to compare with. Run the measure workflow by hand on $BRANCH first." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name measure-results --dir baseline
          echo "file=baseline/results.json" >> "$GITHUB_OUTPUT"
      - name: Screen
        if: steps.base.outputs.file != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TESTS: ${{ steps.reach.outputs.tests }}
          BASELINE: ${{ steps.base.outputs.file }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q anthropic
            python3 measure/run_tests.py screen --rev "$HEAD" --tests "$TESTS" --baseline "$BASELINE" \
              --out screen.json --cap 2 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npm install -g -s @anthropic-ai/claude-code
            # The pull request's skill, with the base branch's tests and plugin settings.
            root="$RUNNER_TEMP/under-test"
            mkdir -p "$root"
            git archive "$HEAD" skills | tar -x -C "$root"
            cp -R .claude-plugin "$root/"
            mkdir -p "$root/measure" && cp -R measure/evals "$root/measure/"
            python3 measure/run_tests.py screen --engine claude-code --root "$root" --rev "$HEAD" --tests "$TESTS" \
              --baseline "$BASELINE" --out screen.json --cap 5 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('screen.json') != ''
        with:
          name: screen-results
          path: screen.json

  full:
    if: github.event_name != 'pull_request_target'
    name: Conversation tests (full run)
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: measure
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Full run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CAP: ${{ inputs.cap }}
          REV: ${{ inputs.ref || github.sha }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Not run: the measure environment holds no key for the tests." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            pip install -q anthropic
            python3 measure/run_tests.py run --rev "$REV" --out results.json --cap "$CAP" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npm install -g -s @anthropic-ai/claude-code
            python3 measure/run_tests.py run --engine claude-code --rev "$REV" --out results.json --cap "$CAP" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('results.json') != ''
        with:
          name: measure-results
          path: results.json
          retention-days: 90
