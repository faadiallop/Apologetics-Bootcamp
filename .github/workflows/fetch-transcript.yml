name: Fetch transcript

# Gets one YouTube video's transcript through a free transcript site, using a
# headless browser (YouTube refuses direct downloads from GitHub's servers).
# The text is kept as a workflow artifact for three days and never committed:
# the repo is public.

on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube video ID or link"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the video ID
        id: id
        env:
          VIDEO: ${{ inputs.video }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, sys
          v = os.environ["VIDEO"].strip()
          m = re.search(r"(?:v=|youtu\.be/|shorts/|embed/)([A-Za-z0-9_-]{11})", v) \
              or re.fullmatch(r"([A-Za-z0-9_-]{11})", v)
          if not m:
              sys.exit("Not a YouTube video ID or link")
          print(f"vid={m.group(1)}")
          PY

      - name: Install browser
        run: pip install playwright && playwright install --with-deps chromium

      - name: Fetch transcript
        env:
          VID: ${{ steps.id.outputs.vid }}
        run: python .github/scripts/fetch_transcript.py "transcript-${VID}.txt"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: transcript-${{ steps.id.outputs.vid }}
          path: transcript-${{ steps.id.outputs.vid }}.txt
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshot
          path: failure.png
          if-no-files-found: ignore
          retention-days: 3
