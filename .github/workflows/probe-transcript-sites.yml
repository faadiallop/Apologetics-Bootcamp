name: Probe transcript sites

on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube video ID (11 characters)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Probe
        env:
          VID: ${{ inputs.video }}
        run: python .github/scripts/probe_sites.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-shots
          path: shots
          retention-days: 3
