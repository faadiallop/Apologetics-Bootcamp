name: Probe youtube-transcript-api

on:
  workflow_dispatch:
    inputs:
      video:
        description: "YouTube video ID (11 characters)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install youtube-transcript-api
      - name: Try it
        env:
          VID: ${{ inputs.video }}
        run: |
          python - <<'PY'
          import os
          from youtube_transcript_api import YouTubeTranscriptApi
          try:
              t = YouTubeTranscriptApi().fetch(os.environ["VID"])
              print("RESULT OK", len(t.snippets), "segments; first:", t.snippets[0].text[:60])
          except Exception as e:
              print("RESULT FAILED", type(e).__name__, str(e)[:300].replace("\n", " "))
          PY
