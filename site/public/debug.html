<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Apologetics Boot Camp: owner's test page</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2f5d8a; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  p.note { margin: 0 0 1rem; opacity: .75; font-size: .9rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }
  input, select, textarea, button { font: inherit; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: .4rem; background: transparent; color: inherit; }
  textarea { flex: 1 1 100%; min-height: 4.5rem; resize: vertical; }
  input[type=password] { flex: 1; min-width: 12rem; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.plain { background: transparent; color: inherit; border-color: var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  #log { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; min-height: 14rem; margin: .75rem 0; }
  .turn { margin: 0 0 .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn b { display: block; font-size: .8rem; opacity: .7; font-weight: 600; }
  .me { padding-left: 1.5rem; }
  .err { color: #b3261e; }
  #status { font-size: .9rem; border-top: 1px solid var(--line); padding-top: .5rem; white-space: pre-wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Apologetics Boot Camp</h1>
<p class="note">Owner's test page for step 1. Not for trainees yet.</p>

<form id="signin">
  <input id="token" type="password" placeholder="Owner token" autocomplete="off" aria-label="Owner token">
  <button>Sign in</button>
</form>

<div id="app" hidden>
  <form id="start">
    <select id="group" aria-label="Group"></select>
    <button type="button" class="plain" id="new">New session</button>
    <button type="button" class="plain" id="pause">Pause all training</button>
  </form>
  <div id="log" aria-live="polite"></div>
  <form id="say">
    <textarea id="text" placeholder="Say something to the coach…" aria-label="Your message"></textarea>
    <button id="send">Send</button>
  </form>
  <div id="status"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = "", session = null, paused = false;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { authorization: "Bearer " + token, ...(body ? { "content-type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
}

function show(who, text, cls) {
  const div = document.createElement("div");
  div.className = "turn " + (cls || "");
  const b = document.createElement("b");
  b.textContent = who;
  div.append(b, document.createTextNode(text));
  $("log").append(div);
  div.scrollIntoView({ block: "end" });
}

async function refresh() {
  const { ok, data } = await api("/api/status");
  if (!ok) return false;
  paused = data.paused;
  $("pause").textContent = paused ? "Resume training" : "Pause all training";
  if (!$("group").options.length)
    for (const [id, name] of Object.entries(data.groups)) $("group").add(new Option(name, id));
  const s = data.spent_usd, l = data.limits_usd;
  $("status").textContent =
    (paused ? "TRAINING IS PAUSED\n" : "") +
    `You today $${s.you_today} of $${l.you_today} · you this month $${s.you_month} of $${l.you_month}\n` +
    `Site today $${s.site_today} of $${l.site_today} · site this month $${s.site_month} of $${l.site_month}`;
  return true;
}

$("signin").addEventListener("submit", async (e) => {
  e.preventDefault();
  token = $("token").value.trim();
  if (await refresh()) { $("signin").hidden = true; $("app").hidden = false; $("text").focus(); }
  else alert("That token was not accepted.");
});

$("new").addEventListener("click", () => { session = null; $("log").replaceChildren(); $("group").disabled = false; });

$("pause").addEventListener("click", async () => { await api("/api/admin/pause", { paused: !paused }); refresh(); });

$("say").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  show("You", text, "me");
  $("text").value = "";
  const { ok, data } = await api("/api/turn", { session_id: session, group: $("group").value, text });
  if (ok) {
    session = data.session_id;
    $("group").disabled = true;
    show(data.in_round ? "In the round" : "Coach", data.reply);
  } else {
    show("Site", data.error || "Something went wrong.", "err");
  }
  $("send").disabled = false;
  refresh();
});

$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("say").requestSubmit(); }
});
</script>
</body>
</html>
