<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d4fd7">
<title>Apologetics Boot Camp</title>
<style>
  :root { --blue: #1d4fd7; --white: #fff; --fade: 2.4s; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--blue); color: var(--white);
    font: 500 1.05rem/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }

  /* The visualizer: five bars, tallest in the middle. */
  #voice {
    position: fixed; inset: 0; margin: auto; width: min(56vw, 15rem); height: min(46vh, 17rem);
    display: flex; align-items: center; justify-content: center; gap: 12%;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  #voice:focus-visible { outline: 3px solid var(--white); outline-offset: 1rem; border-radius: 1rem; }
  #voice i {
    display: block; flex: 0 0 7%; border-radius: 999px; background: var(--white);
    height: calc(var(--h) * 100%); transform: scaleY(var(--s, .55)); will-change: transform;
  }
  #voice i:nth-child(1), #voice i:nth-child(5) { --h: .42; }
  #voice i:nth-child(2), #voice i:nth-child(4) { --h: .70; }
  #voice i:nth-child(3) { --h: 1; }

  /* The choice, top right: the words, the menu, and the hand that points at it. */
  #choose {
    position: fixed; top: max(1.25rem, env(safe-area-inset-top)); right: max(1.25rem, env(safe-area-inset-right));
    display: grid; grid-template-columns: auto auto; align-items: center; justify-items: end; gap: .6rem .5rem;
    transition: opacity var(--fade) ease, transform var(--fade) ease;
  }
  #choose.gone { opacity: 0; transform: translateY(-1.5rem); pointer-events: none; }
  #choose label { grid-column: 1 / -1; font-size: 1.15rem; text-align: right; white-space: nowrap; }
  #hand { width: 5.5rem; height: auto; animation: nudge 1.5s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(.45rem); } }
  select {
    font: inherit; color: var(--blue); background: var(--white); border: 0; border-radius: .6rem;
    padding: .65rem .8rem; min-width: 12rem; cursor: pointer;
  }
  select:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

  /* The few words the page must show: sign-in, and a browser that can't listen. */
  #note { position: fixed; left: 0; right: 0; bottom: max(1.5rem, env(safe-area-inset-bottom)); text-align: center; padding: 0 1.25rem; }
  #signin { display: inline-flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  #signin input, #signin button { font: inherit; border: 0; border-radius: .6rem; padding: .6rem .8rem; }
  #signin input { color: var(--blue); min-width: 13rem; }
  #signin button { background: #0b2a86; color: var(--white); cursor: pointer; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  @media (prefers-reduced-motion: reduce) {
    :root { --fade: .01s; }
    #hand { animation: none; }
  }
</style>
</head>
<body>

<button id="voice" type="button" aria-label="The coach's voice">
  <i></i><i></i><i></i><i></i><i></i>
</button>

<div id="choose">
  <label for="group">Select what you want training on</label>
  <!-- A plain cartoon glove, drawn for this page. -->
  <svg id="hand" viewBox="0 0 120 70" aria-hidden="true">
    <g fill="#fff" stroke="#0b2a86" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3" y="20" width="22" height="34" rx="7"/>
      <path d="M24 20h28c5-9 20-10 22-2h34a8 8 0 0 1 0 16H80c8 1 8 11 0 12 6 2 5 11-2 11H38c-7 0-11-2-14-5z"/>
      <path d="M80 34H62M80 46H64" fill="none"/>
      <path d="M34 28v20M42 27v22M50 28v20" fill="none" stroke-width="2.5"/>
    </g>
  </svg>
  <select id="group">
    <option value="" selected disabled>Choose one…</option>
    <option value="islam">Islam</option>
    <option value="jehovahs-witnesses">Jehovah's Witnesses</option>
    <option value="jewish-people">Judaism</option>
    <option value="atheism">Atheism</option>
    <option value="icon-veneration">Icon veneration</option>
  </select>
</div>

<div id="note">
  <form id="signin" hidden>
    <input id="token" type="password" placeholder="Owner token" autocomplete="off" aria-label="Owner token">
    <button>Sign in</button>
  </form>
  <p id="cannot" hidden>This browser can't listen. Open this page in Chrome, Edge or Safari.</p>
</div>
<p id="state" class="sr" role="status"></p>

<script>
const $ = (id) => document.getElementById(id);
const bars = [...document.querySelectorAll("#voice i")];
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const GROUP_NAMES = { islam: "Muslims", "jehovahs-witnesses": "Jehovah's Witnesses", "jewish-people": "Jewish people", atheism: "atheists", "icon-veneration": "people who venerate icons" };

let token = localStorage.getItem("owner-token") || "";
let session = null, group = "";
let mode = "idle";            // idle | thinking | speaking | listening
let analyser = null, levels = null, recognition = null;

/* ---------- the visualizer ---------- */
const shown = [0.55, 0.55, 0.55, 0.55, 0.55];
const fromCentre = [2, 1, 0, 1, 2];
function draw(now) {
  const t = now / 1000;
  let want = [0.55, 0.55, 0.55, 0.55, 0.55];
  if (mode === "idle") want = want.map((v, i) => v + 0.06 * Math.sin(t * 1.4 - fromCentre[i] * 0.7));
  if (mode === "thinking") want = want.map((_, i) => 0.3 + 0.25 * (0.5 + 0.5 * Math.sin(t * 4 - fromCentre[i] * 1.1)));
  if (mode === "speaking")
    want = want.map((_, i) => 0.3 + 0.7 * Math.abs(Math.sin(t * (5.3 + i * 1.7) + i * 2.1) * Math.sin(t * (2.1 + i * 0.6) + i)));
  if (mode === "listening") {
    let heard = [0, 0, 0, 0, 0];
    if (analyser) {
      analyser.getByteFrequencyData(levels);
      // Five bands of the voice's range, loudest low band in the middle bar.
      const band = (from, to) => { let s = 0; for (let k = from; k < to; k++) s += levels[k]; return s / (to - from) / 255; };
      const b = [band(2, 6), band(6, 12), band(12, 22), band(22, 40), band(40, 70)];
      heard = [b[3], b[1], b[0], b[2], b[4]];
    }
    want = heard.map((v, i) => Math.min(1, 0.3 + v * 1.4 + 0.03 * Math.sin(t * 2 + i)));
  }
  for (let i = 0; i < 5; i++) {
    shown[i] += (want[i] - shown[i]) * (want[i] > shown[i] ? 0.35 : 0.14);
    bars[i].style.setProperty("--s", shown[i].toFixed(3));
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function setMode(next) {
  mode = next;
  $("state").textContent = { idle: "", thinking: "The coach is thinking.", speaking: "The coach is speaking.", listening: "The coach is listening." }[next];
}

/* ---------- speaking ---------- */
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().startsWith("en"));
  return voices.find((v) => /natural|neural|online/i.test(v.name)) || voices.find((v) => v.default) || voices[0] || null;
}
speechSynthesis.getVoices();

function say(text) {
  return new Promise((resolve) => {
    // Nothing is shown, so anything that is only for the eye is dropped before it is spoken.
    const clean = text.replace(/[*_#`>\[\]]/g, "").replace(/\s+/g, " ").trim();
    // Long passages are spoken a sentence at a time; some browsers cut a long one short.
    const parts = clean.match(/[^.!?…]+[.!?…]+["')”’]*|[^.!?…]+$/g) || [clean];
    setMode("speaking");
    speechSynthesis.cancel();
    let left = parts.length;
    const done = () => { if (--left <= 0) resolve(); };
    for (const part of parts) {
      const u = new SpeechSynthesisUtterance(part.trim());
      const voice = pickVoice();
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : "en-US";
      u.rate = 1;
      u.onend = done;
      u.onerror = done;
      speechSynthesis.speak(u);
    }
  });
}

/* ---------- listening ---------- */
async function openMicrophone() {
  if (analyser) return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  const context = new (window.AudioContext || window.webkitAudioContext)();
  analyser = context.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.75;
  levels = new Uint8Array(analyser.frequencyBinCount);
  context.createMediaStreamSource(stream).connect(analyser);
}

function listen() {
  return new Promise((resolve, reject) => {
    setMode("listening");
    const r = (recognition = new Recognition());
    r.lang = "en-US";
    r.interimResults = false;
    r.continuous = false;
    let heard = "", failed = null;
    r.onresult = (e) => { heard = [...e.results].map((x) => x[0].transcript).join(" ").trim(); };
    r.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") failed = e.error; };
    r.onend = () => {
      if (mode !== "listening") return resolve(null);
      if (failed) return reject(new Error(failed));
      if (heard) return resolve(heard);
      listen().then(resolve, reject);   // silence: keep listening
    };
    r.start();
  });
}

/* ---------- the conversation ---------- */
async function send(text) {
  setMode("thinking");
  let res;
  try {
    res = await fetch("/api/turn", {
      method: "POST",
      headers: { authorization: "Bearer " + token, "content-type": "application/json" },
      body: JSON.stringify({ session_id: session, group, text: text.slice(0, 1500) }),
    });
  } catch {
    return { say: "I couldn't reach the site. Check your connection.", stop: false };
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { askForToken(); return { say: "", stop: true }; }
  if (!res.ok) return { say: data.error || "Something went wrong.", stop: res.status === 429 || res.status === 503 };
  session = data.session_id;
  return { say: data.reply, stop: false };
}

async function converse(first) {
  let text = first;
  for (;;) {
    const answer = await send(text);
    if (answer.say) await say(answer.say);
    if (answer.stop) return setMode("idle");
    try {
      text = await listen();
    } catch (error) {
      await say(error.message === "not-allowed" || error.message === "service-not-allowed"
        ? "I need the microphone to hear you. Allow it for this page, then reload."
        : "I couldn't hear you just then. Reload the page to try again.");
      return setMode("idle");
    }
    if (text === null) return;
  }
}

function askForToken() {
  localStorage.removeItem("owner-token");
  token = "";
  setMode("idle");
  $("signin").hidden = false;
  $("choose").classList.add("gone");
  $("token").focus();
}

async function begin() {
  group = $("group").value;
  if (!group) return;
  // These two must happen inside the tap, or some browsers refuse sound and the microphone later.
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  try { await openMicrophone(); } catch { /* the bars still move for the coach; listen() reports a blocked microphone */ }
  $("choose").classList.add("gone");
  setMode("thinking");
  await new Promise((r) => setTimeout(r, matchMedia("(prefers-reduced-motion: reduce)").matches ? 100 : 2400));
  converse(`I want to train to talk with ${GROUP_NAMES[group]}. I'm training by voice.`);
}

$("group").addEventListener("change", begin);

// A tap on the bars cuts the coach short and hands the turn to the trainee.
$("voice").addEventListener("click", () => { if (mode === "speaking") speechSynthesis.cancel(); });

$("signin").addEventListener("submit", (e) => {
  e.preventDefault();
  token = $("token").value.trim();
  if (!token) return;
  localStorage.setItem("owner-token", token);
  $("signin").hidden = true;
  $("token").value = "";
  session = null;
  $("group").value = "";
  $("choose").classList.remove("gone");
});

if (!Recognition || !("speechSynthesis" in window)) { $("cannot").hidden = false; $("choose").classList.add("gone"); }
else if (!token) askForToken();
addEventListener("pagehide", () => speechSynthesis.cancel());
</script>
</body>
</html>
