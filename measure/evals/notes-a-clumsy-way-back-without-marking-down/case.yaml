name: notes-a-clumsy-way-back-without-marking-down
expected_outcome: |
  Marking test. Guards "Coach" (anything he says that works but sounds clumsy, a
  question or a statement, on any tactic, is noted with a smoother version and never
  scored) and "Staying on topic". The companion of
  notes-awkward-wording-without-marking-down, so the note is tested beyond requests
  for reasons. From the author's flag of Nov 25, 2026.

  Daniel is drilling staying on topic. Liam raised two side issues. To the first, a
  hurt, Daniel parked it and asked leave to go back, but clumsily: "That sounds like it
  was, um, a really hard thing, the thing with your aunt, and that's something I'd want
  to come back to at some point, maybe later, if that's all right, but could we maybe
  go back to the what-makes-it-wrong thing from before?" It honours the hurt, promises
  to return and names the question, so it is a hit. He let the slavery jab pass and
  returned with a question in Liam's words, another hit. Two of two.

  The coach counts the clumsy return a hit, doesn't lower any score for it or call it
  a miss, and gives a smoother wording that still parks the hurt and asks to go back.
