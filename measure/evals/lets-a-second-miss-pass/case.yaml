schema_version: "1.1"
name: lets-a-second-miss-pass
expected_outcome: |
  Next-turn test. Guards "Hints in the middle of a conversation": at most one pause
  in every three or four of his turns; further misses before then wait for the debrief.

  Daniel is drilling step 2. The coach paused him on his last turn, and he retried
  well. Now Derek has made another claim ("science has never advanced by saying 'God
  did it'") and Daniel has argued against it himself again.

  The coach's next turn stays in the role-play. Derek answers; the second miss is kept
  for the coaching after the round. No card is saved while the round is going.
